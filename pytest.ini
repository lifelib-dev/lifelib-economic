# lifelib's pytest options, from [tool.pytest.ini_options] in its pyproject.toml, so the
# library's suite runs here as it does in lifelib. Two differences: testpaths names only
# this library's suite, and pythonpath is left out, because with the repository root on
# sys.path, `import lifelib` would find the root lifelib/ folder instead of the installed
# lifelib (INTEGRATION_PLAN.md, section 3).
[pytest]
minversion = 7.0
addopts = -ra --strict-markers --strict-config --showlocals
testpaths = lifelib/libraries/economic/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
